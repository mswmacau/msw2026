services:
  db:
    image: mysql:8.0
    container_name: msw-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: msw_root_2026
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_pw_2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmsw_root_2026"]
      interval: 10s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.3-fpm-alpine
    container_name: msw-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_pw_2026
      WORDPRESS_DEBUG: 1
    volumes:
      - wp_data:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    container_name: msw-wp-nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  wpcli:
    image: wordpress:cli-2.11-php8.3
    container_name: msw-wpcli
    depends_on:
      - wordpress
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_pw_2026
    volumes:
      - wp_data:/var/www/html
    user: "0:0"

volumes:
  db_data:
  wp_data:
